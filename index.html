<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلبات البيت الذكية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* نافذة إدخال الاسم الإجبارية */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            width: 360px;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-box h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            text-align: center;
        }

        .login-box input:focus {
            border-color: #667eea;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        /* التطبيق الرئيسي */
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 480px;
            max-width: 100%;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #f1f3f5;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }

        h2 i {
            color: #667eea;
            margin-left: 8px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .card input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .card input[type="text"]:focus {
            border-color: #667eea;
        }

        .card button.add-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #495057;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        ul {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        li {
            background: #f8f9fa;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eaeaea;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .item-info input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-text {
            font-size: 15px;
            color: #333;
            font-weight: 600;
        }

        li.completed .item-text {
            text-decoration: line-through;
            color: #adb5bd;
        }

        .item-meta {
            font-size: 11px;
            color: #888;
        }

        .delete-btn {
            background: #ff6b6b;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 6px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #fa5252;
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h3>من فضلك اكتب اسمك للبدء</h3>
            <input type="text" id="usernameInput" placeholder="اكتب اسمك هنا...">
            <button id="startBtn">دخول للبرنامج</button>
        </div>
    </div>

    <div class="card" id="mainApp">
        <div class="header-info">
            <span id="welcomeUser">أهلاً يا...</span>
            <span id="dateTimeDisplay">جاري الوقت...</span>
        </div>

        <h2><i class="fa-solid fa-cart-shopping"></i> طلبات البيت الذكية</h2>
        
        <div class="input-section">
            <input type="text" id="itemInput" placeholder="اكتب الطلب (مثل: طماطم، لبن)...">
            <button class="add-btn" id="addBtn"><i class="fa-solid fa-plus"></i> إضافة</button>
        </div>

        <div class="section-title">⏳ الطلبات المعلقة (المطلوبة)</div>
        <ul id="pendingList"></ul>

        <div class="section-title">✅ الطلبات التي تم إنجازها</div>
        <ul id="completedList"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyABqBK8Nmk8x-OUR0mH-2yu-rInN5r7egQ",
          authDomain: "tony-691bc.firebaseapp.com",
          projectId: "tony-691bc",
          storageBucket: "tony-691bc.firebasestorage.app",
          messagingSenderId: "124196190221",
          appId: "1:124196190221:web:8d0ed174370335fd357d44",
          measurementId: "G-9H1H5ZX567"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', function() {
            const loginOverlay = document.getElementById('loginOverlay');
            const usernameInput = document.getElementById('usernameInput');
            const startBtn = document.getElementById('startBtn');
            const welcomeUser = document.getElementById('welcomeUser');
            const dateTimeDisplay = document.getElementById('dateTimeDisplay');

            const itemInput = document.getElementById('itemInput');
            const addBtn = document.getElementById('addBtn');
            const pendingList = document.getElementById('pendingList');
            const completedList = document.getElementById('completedList');

            let currentUserName = localStorage.getItem('userName');

            // التحقق من وجود الاسم المخزن مسبقاً
            if (currentUserName) {
                loginOverlay.style.display = 'none';
                welcomeUser.textContent = `أهلاً يا ${currentUserName}`;
            } else {
                loginOverlay.style.display = 'flex'; // إظهار نافذة تسجيل الاسم بشكل إجباري
            }

            // زر الدخول وتسجيل الاسم
            startBtn.addEventListener('click', function() {
                const name = usernameInput.value.trim();
                if (name !== "") {
                    localStorage.setItem('userName', name);
                    currentUserName = name;
                    loginOverlay.style.display = 'none';
                    welcomeUser.textContent = `أهلاً يا ${name}`;
                } else {
                    alert('من فضلك اكتب اسمك ليظهر في الترحيب!');
                }
            });

            // الوقت والتاريخ
            function updateDateTime() {
                const now = new Date();
                const options = { weekday: 'long', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                dateTimeDisplay.textContent = now.toLocaleDateString('ar-EG', options);
            }
            setInterval(updateDateTime, 1000);
            updateDateTime();

            // إضافة طلب جديد
            addBtn.addEventListener('click', async function() {
                const text = itemInput.value.trim();
                if (text !== "") {
                    try {
                        const now = new Date();
                        const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                        const dateStr = now.toLocaleDateString('ar-EG');

                        await addDoc(collection(db, "shopping_items"), {
                            text: text,
                            completed: false,
                            addedBy: currentUserName,
                            date: `${dateStr} - ${timeStr}`,
                            timestamp: Date.now()
                        });
                        itemInput.value = "";
                    } catch (e) {
                        console.error("خطأ أثناء الإضافة: ", e);
                        alert("حدث خطأ أثناء حفظ الطلب. تأكد من إعداد قواعد Firebase Rules.");
                    }
                }
            });

            itemInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addBtn.click();
                }
            });

            // تحديث القوائم فوراً بدون ريفرش
            const q = query(collection(db, "shopping_items"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                pendingList.innerHTML = "";
                completedList.innerHTML = "";

                snapshot.forEach((docSnapshot) => {
                    const itemData = docSnapshot.data();
                    const itemId = docSnapshot.id;

                    const li = document.createElement('li');
                    if (itemData.completed) {
                        li.classList.add('completed');
                    }

                    const itemInfo = document.createElement('div');
                    itemInfo.classList.add('item-info');

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = itemData.completed;

                    // عند الضغط على الـ Checkbox تنتقل الطلبات للقسم الصحيح فوراً
                    checkbox.addEventListener('change', async function() {
                        const itemRef = doc(db, "shopping_items", itemId);
                        await updateDoc(itemRef, {
                            completed: checkbox.checked
                        });
                    });

                    const detailsDiv = document.createElement('div');
                    detailsDiv.classList.add('item-details');

                    const spanText = document.createElement('span');
                    spanText.classList.add('item-text');
                    spanText.textContent = itemData.text;

                    const spanMeta = document.createElement('span');
                    spanMeta.classList.add('item-meta');
                    spanMeta.textContent = `طلب بواسطة: ${itemData.addedBy} (${itemData.date})`;

                    detailsDiv.appendChild(spanText);
                    detailsDiv.appendChild(spanMeta);

                    itemInfo.appendChild(checkbox);
                    itemInfo.appendChild(detailsDiv);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                    deleteBtn.classList.add('delete-btn');
                    deleteBtn.addEventListener('click', async function() {
                        await deleteDoc(doc(db, "shopping_items", itemId));
                    });

                    li.appendChild(itemInfo);
                    li.appendChild(deleteBtn);

                    if (itemData.completed) {
                        completedList.appendChild(li); // الطلبات المنجزة
                    } else {
                        pendingList.appendChild(li); // الطلبات المعلقة
                    }
                });
            });
        });
    </script>
</body>
</html>
